<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
  }
  body { display: grid; place-items: center; }

  :root {
    --lf-core: #ffffff;
    --lf-system: #3b82f6;
    --lf-fault: #ef4444;
    --lf-surface: #18181b;
  }

  /* ── the pill the face sits in ─────────────────────────── */
  .shell {
    display: grid;
    place-items: center;
    width: 104px;
    height: 50px;
    border-radius: 16px;
    background: rgba(24, 24, 27, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 10px 30px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.4);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: border-color 160ms ease;
  }
  .shell[data-tone='system'] { border-color: rgba(59,130,246,.45); }
  .shell[data-tone='fault']  { border-color: rgba(239,68,68,.5); }

  /* ── keyframes (exact, from the design) ────────────────── */
  @keyframes lf-breathe {0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  @keyframes lf-blink {0%,84%{transform:scaleY(1)}90%{transform:scaleY(.1)}96%,100%{transform:scaleY(1)}}
  @keyframes lf-jitter {0%,100%{transform:translateX(0);opacity:1}20%{transform:translateX(-3px);opacity:.8}40%{transform:translateX(3px);opacity:1}60%{transform:translateX(-1px);opacity:.9}}
  @keyframes lf-tilt-r {0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
  @keyframes lf-brk-pulse {0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  @keyframes lf-eye-pulse {0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
  @keyframes lf-alt-a {0%{opacity:.4}50%{opacity:1}100%{opacity:.4}}
  @keyframes lf-alt-b {0%{opacity:1}50%{opacity:.4}100%{opacity:1}}
  @keyframes lf-ping-l {0%,100%{transform:translateX(0)}50%{transform:translateX(-6px)}}
  @keyframes lf-ping-r {0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
  @keyframes lf-err {0%,22%,100%{transform:translateX(0)}5%{transform:translateX(-5px)}11%{transform:translateX(5px)}17%{transform:translateX(-5px)}}
  @keyframes lf-dash-a {0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}
  @keyframes lf-dash-b {0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
  @keyframes lf-sonar {0%{transform:scale(.8);opacity:1}100%{transform:scale(1.6);opacity:0}}
  @keyframes lf-bar {0%{transform:translateY(-115%)}100%{transform:translateY(115%)}}

  /* ── face ──────────────────────────────────────────────── */
  .lf {
    --lf-h: 30px;
    --lf-tone: var(--lf-core);
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: calc(var(--lf-h) * .12);
    height: var(--lf-h);
    color: var(--lf-tone);
    overflow: hidden;
  }
  .lf-brk { height: var(--lf-h); width: auto; flex: none; color: inherit; transform-origin: center; }
  .lf-eyes { display: inline-flex; align-items: center; gap: calc(var(--lf-h) * .18); transform-origin: center; }
  .lf-dot { width: calc(var(--lf-h) * .145); height: calc(var(--lf-h) * .145); border-radius: 50%; background: currentColor; transform-origin: center; }
  .lf-sonar {
    position: absolute; inset: 50% auto auto 50%;
    width: calc(var(--lf-h) * .9); height: calc(var(--lf-h) * .9);
    margin: calc(var(--lf-h) * -.45) 0 0 calc(var(--lf-h) * -.45);
    border: 1.5px solid currentColor; border-radius: 50%; opacity: 0; pointer-events: none;
  }
  .lf-bar { position: absolute; inset: 0; background: currentColor; opacity: 0; pointer-events: none; mix-blend-mode: overlay; }

  /* ── states ────────────────────────────────────────────── */
  .lf[data-state='idle'] .lf-eyes { animation: lf-breathe 2.8s ease-in-out infinite; }
  .lf[data-state='idle'] .lf-dot  { animation: lf-blink 4.4s ease-in-out infinite; }

  .lf[data-state='listening'] .lf-dot { animation: lf-eye-pulse 1.4s ease-in-out infinite; }

  .lf[data-state='thinking'] .lf-dot-a { animation: lf-alt-a 1.1s ease-in-out infinite; }
  .lf[data-state='thinking'] .lf-dot-b { animation: lf-alt-b 1.1s ease-in-out infinite; }

  .lf[data-state='happy'] .lf-brk { animation: lf-brk-pulse 1.2s ease-in-out infinite; }
  .lf[data-state='curious'] { animation: lf-tilt-r 1.6s ease-in-out infinite; }

  .lf[data-state='loading']  { --lf-tone: var(--lf-system); }
  .lf[data-state='loading'] .lf-bar { opacity: .55; animation: lf-bar 1.2s linear infinite; }

  .lf[data-state='scanning'] { --lf-tone: var(--lf-system); }
  .lf[data-state='scanning'] .lf-sonar { animation: lf-sonar 1.8s ease-out infinite; }

  .lf[data-state='transfer'] { --lf-tone: var(--lf-system); }
  .lf[data-state='transfer'] .lf-brk-l { animation: lf-ping-l 1s ease-in-out infinite; }
  .lf[data-state='transfer'] .lf-brk-r { animation: lf-ping-r 1s ease-in-out infinite; }

  .lf[data-state='sync'] { --lf-tone: var(--lf-system); }
  .lf[data-state='sync'] .lf-dot-a { animation: lf-dash-a .9s linear infinite; }
  .lf[data-state='sync'] .lf-dot-b { animation: lf-dash-b .9s linear infinite; }

  .lf[data-state='error'] { --lf-tone: var(--lf-fault); animation: lf-err .8s ease-in-out infinite; }
  .lf[data-state='error'] .lf-dot { animation: lf-jitter .8s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    .lf, .lf * { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="shell" id="shell" data-tone="core">
    <span class="lf" id="face" data-state="idle">
      <svg class="lf-brk lf-brk-l" viewBox="0 0 14 36" fill="none">
        <path d="M12 2 L5.5 2 L2 5.5 L2 30.5 L5.5 34 L12 34"
              stroke="currentColor" stroke-width="2.6"
              stroke-linecap="square" stroke-linejoin="miter"/>
      </svg>
      <span class="lf-eyes">
        <span class="lf-dot lf-dot-a"></span>
        <span class="lf-dot lf-dot-b"></span>
      </span>
      <svg class="lf-brk lf-brk-r" viewBox="0 0 14 36" fill="none">
        <path d="M2 2 L8.5 2 L12 5.5 L12 30.5 L8.5 34 L2 34"
              stroke="currentColor" stroke-width="2.6"
              stroke-linecap="square" stroke-linejoin="miter"/>
      </svg>
      <span class="lf-sonar"></span>
      <span class="lf-bar"></span>
    </span>
  </div>

<script>
  const SYSTEM_STATES = new Set(['loading', 'scanning', 'transfer', 'sync']);

  // Called from Swift.
  window.setFaceState = function (state) {
    const face = document.getElementById('face');
    const shell = document.getElementById('shell');
    if (face.dataset.state === state) return;
    face.dataset.state = state;
    shell.dataset.tone =
      state === 'error' ? 'fault' : SYSTEM_STATES.has(state) ? 'system' : 'core';
  };
</script>
</body>
</html>
